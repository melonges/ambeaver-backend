services:
  api:
    build:
      dockerfile: Dockerfile
      context: .
      target: production
    restart: on-failure:5
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    command: ['npm', 'run', 'start:prod']
    ports:
      - 3000:3000
    depends_on:
      - postgres
  postgres:
    image: postgres:16.2-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis/redis-stack:7.2.0-v2
    ports:
      - 6379:6379
      - 8001:8001
    volumes:
      - redis:/data
volumes:
  postgres:
    driver: local
  redis:
    driver: local
